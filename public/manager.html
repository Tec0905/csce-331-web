<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager</title>
</head>
<body>
  <h1>Manager</h1>
  <p id="output"></p>

  <script>
    function helloWorld() {
      console.log("Hello World");
      document.getElementById("output").textContent = "Hello World";
    }

    helloWorld();
  </script>
</body>
</html>
