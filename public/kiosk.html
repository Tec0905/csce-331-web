<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>83 GUYS | Self-Service Kiosk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="kiosk.css">
</head>

<body>
    <header>
        <div class="logo">83<span>GUYS</span></div>
        <div class="header-note">Boba &amp; tea bar · Self-service ordering</div>
    </header>

    <div class="layout">
        <main>
            <section class="welcome">
                <h1>What are you sipping today?</h1>
                <p>Pick a drink, then make it yours with your size, sweetness, ice, and toppings.</p>
            </section>

            <nav class="categories" id="categories"
                 aria-label="Menu categories"></nav>

            <div class="section-heading">
                <h2 id="menu-title">Popular Drinks</h2>
                <span>Prices in USD</span>
            </div>

            <section class="menu-grid" id="menu-grid"
                     aria-label="Menu items"></section>
        </main>

        <aside class="order-panel" aria-label="Your order">
            <div class="order-title">
                <h2>Your Order</h2>
                <span class="item-count" id="item-count">0 items</span>
            </div>

            <div class="order-items" id="order-items" aria-live="polite"></div>

            <div class="order-summary">
                <div class="summary-line muted">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>

                <div class="summary-line muted">
                    <span>Tax (8.25%)</span>
                    <span id="tax">$0.00</span>
                </div>

                <div class="summary-line total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>

                <button class="checkout-button" id="checkout"
                        type="button" disabled>
                    Checkout · $0.00
                </button>

                <button class="clear-button" id="clear-order" type="button">
                    Clear order
                </button>
            </div>
        </aside>
    </div>

    <dialog class="customizer" id="customizer"
            aria-labelledby="customizer-title">
        <form class="customizer-form" id="customizer-form">
            <div class="customizer-preview">
                <div class="customizer-cup" id="customizer-cup"
                     aria-hidden="true"></div>
                <h2 id="customizer-title"></h2>
                <p id="customizer-description"></p>
            </div>

            <div class="customizer-options" id="customizer-options"></div>

            <div class="customizer-actions">
                <button class="cancel-button" id="customizer-cancel"
                        type="button">
                    Cancel
                </button>
                <button class="checkout-button" id="customizer-submit"
                        type="submit"></button>
            </div>
        </form>
    </dialog>

    <div class="notice" id="notice" role="status"
         aria-live="polite" hidden></div>

    <script src="kiosk-menu.js"></script>
    <script src="kiosk.js"></script>
</body>
</html>
