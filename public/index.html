
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>83 GUYS | Portal Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f6f4;
            color: #222;
        }

        header {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #e7e7e7;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        header h1 span {
            color: #ed3727;
        }

        main {
            max-width: 850px;
            margin: 55px auto;
            padding: 0 24px;
        }

        .heading {
            margin-bottom: 30px;
        }

        .heading h2 {
            font-size: 32px;
            margin: 0 0 8px;
        }

        .heading p {
            color: #777;
            margin: 0;
            font-size: 16px;
        }

        .interface-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .interface-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 90px;
            padding: 24px;
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 14px;
            color: #222;
            font-size: 18px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .interface-button:hover {
            background: #fff5f3;
            border-color: #ed3727;
        }

        .interface-button:active {
            background: #fce8e5;
        }

        .arrow {
            color: #ed3727;
            font-size: 24px;
            font-weight: 700;
        }

        footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #e7e7e7;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 550px) {
            main {
                margin-top: 36px;
            }

            .interface-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>83<span>GUYS</span></h1>
    </header>

    <main>
        <div class="heading">
            <h2>Portal Hub</h2>
            <p>Select an interface to continue.</p>
        </div>

        <div class="interface-list">

            <button class="interface-button"
                    onclick="location.href='manager.html'">
                Manager
                <span class="arrow">→</span>
            </button>

            <button class="interface-button"
                    onclick="location.href='cashier.html'">
                Cashier
                <span class="arrow">→</span>
            </button>

            <button class="interface-button"
                    onclick="location.href='kiosk.html'">
                Kiosk
                <span class="arrow">→</span>
            </button>

            <button class="interface-button"
                    onclick="location.href='kitchen.html'">
                Kitchen Display
                <span class="arrow">→</span>
            </button>

        </div>

        <footer>
            83 GUYS · Internal Interface Navigation
        </footer>
    </main>

</body>
</html>
